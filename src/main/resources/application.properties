# JDTLS process configuration
# Set this to the directory where jdtls is installed (the folder containing plugins/ and config_linux/).
# If left empty the server will try to find jdtls on the PATH or in common locations
# (~/.local/share/jdtls, /usr/local/jdtls, /opt/jdtls).
# Example: jdtls.install.path=/home/user/.local/share/jdtls
jdtls.install.path=

# When true (default), JDTLS is downloaded automatically from Eclipse's download server
# the first time startJdtls() is called and no local installation can be found.
# The server is installed to ~/.local/share/java-lsp-mcp-server/jdtls.
# Set to false to disable automatic download.
jdtls.auto.download=true

# Optional: pin a specific JDTLS tar.gz download URL instead of resolving the latest release.
# Example: jdtls.download.url=https://download.eclipse.org/jdtls/milestones/1.40.0/jdt-language-server-1.40.0-202503201301.tar.gz
jdtls.download.url=

# Disable auto-download in tests to keep them fast and offline-friendly.
%test.jdtls.auto.download=false
