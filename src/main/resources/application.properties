# JDTLS process configuration
# Set this to the directory where jdtls is installed (the folder containing plugins/ and config_linux/).
# If left empty the server will try to find jdtls on the PATH or in common locations
# (~/.local/share/jdtls, /usr/local/jdtls, /opt/jdtls).
# Example: jdtls.install.path=/home/user/.local/share/jdtls
jdtls.install.path=
